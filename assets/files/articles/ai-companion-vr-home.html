      <h1>AI 伴侣与 VR 家</h1>
      <p>这是 Aiko Works 中的长期构想项目之一，关注 AI 伴侣如何从单一聊天界面延伸到更完整的生活空间。</p>
      <p>项目将持续整理长期记忆、个性化对话、虚拟房间、3D 形象、电子桌宠、多模态交互与创作陪伴等方向。它不是一个一次性完成的功能说明，而是一个会随着作品、文章和实验不断扩展的项目入口。</p>
